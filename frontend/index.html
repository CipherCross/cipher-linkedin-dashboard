<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta
      name="description"
      content="Team dashboard for LinkedIn outreach campaigns run through Linked Helper 2."
    />
    <title>Outreach Deck</title>
    <!-- One light theme, painted before the bundle loads. A `theme` value left
         in localStorage by the retired dark mode is normalised away on first
         run; nothing else in storage is touched. -->
    <script>
      (function () {
        document.documentElement.setAttribute('data-theme', 'light')
        document.documentElement.style.colorScheme = 'light'
        try {
          if (localStorage.getItem('theme') !== null) localStorage.setItem('theme', 'light')
        } catch (e) {
          /* private mode / blocked storage: the attribute above is what matters */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
