# Copy to config.yaml on each notebook and edit. config.yaml is gitignored —
# it contains the service-role key, never commit it.
#
# ONLINE CONFIG: the three legacy bootstrap keys below plus the machine token
# and release public key must be set locally. The token is the one credential
# used for ingest, config, photo upload, notify and release authorization;
# EVERYTHING else in this file
# (instance_label, account_*, the sync_* toggles, lh2_db_path, even the mapping)
# can be overridden from the dashboard's Health page; the agent merges those
# online values over this file on every sync and REMOTE WINS. So you rarely need
# to touch this file again after the first sync. Set `ignore_remote_config: true`
# to pin a notebook to this file only (escape hatch if a bad online value breaks
# its sync).

supabase_url: "https://YOUR-PROJECT.supabase.co"
supabase_service_key: "YOUR-SERVICE-ROLE-KEY"   # Settings -> API -> service_role

# Self-update: before each scheduled sync the agent asks the authenticated
# machine API for the signed current release, verifies the Ed25519 signature,
# size and SHA-256, then restarts itself only after an atomic replacement. The
# release bucket and signing key are operator-side; this notebook stores only
# the public key below. Set to false to pin this notebook to its current version.
auto_update: true

# Message-sequence view: the agent automatically extracts each campaign's
# outbound steps (invite + follow-up messages) and their per-step reply rates
# straight from lh.db — no mapping needed, the queries are built in. The step
# TEMPLATE TEXT is synced too, so it becomes anon-readable in Supabase (same
# tradeoff as sync_messages below). Set to false to skip the whole thing.
sync_steps: true

# Conversation history: the agent automatically extracts the full message thread
# per lead — both the messages we sent and the replies we received — straight
# from lh.db (built-in query, no mapping needed). Powers the Replies feed and
# the server-side sentiment + P1/P2/P3 intent classifier. PRIVACY:
# message bodies become anon-readable in Supabase until Auth is on. Set to false
# to skip. Override mapping.messages below only for a non-standard LH2 schema.
sync_messages: true

# Lead photos (UI display ONLY — never used for any inference): after each
# successful sync the agent mirrors each lead's LinkedIn profile photo into the
# private `lead-photos` Storage bucket so the authenticated dashboard can show
# avatars through short-lived signed URLs. OFF by default — flip it on per
# notebook (usually remotely, from the Health page: it's a remote-config key)
# once migration 054 is applied and you're ready for the initial backfill, which
# spreads over several syncs (200 photos per run). Every photo error is swallowed
# — it can NEVER break a sync. NOTE: the same licdn URL expiry as above applies —
# the agent downloads the bytes at sync time from a fresh DB read rather than
# storing the URL; a dead/missing avatar is skipped quietly (marked done, no
# photo) and never retried.
sync_photos: false

# New-reply Slack alerts: after each successful sync the agent pings this
# dashboard endpoint, which posts freshly-synced inbound replies to Slack.
# Usually set remotely from the Health page (it's a remote-config key) rather
# than here. The local-only ingest_token is used for this POST as well; the
# server retains NOTIFY_SECRET only for older agents during the dual period.
# Leave either empty to disable the ping; a failed ping never breaks a sync.
# notify_url: "https://<your-app>.vercel.app/api/notify-replies"

# ---------------------------------------------------------------------------
# Second transport: the machine ingest gateway. OFF by default.
#
# The agent can deliver the same extraction it just pushed to Supabase to the
# dashboard's ingest endpoint as well, authenticating with a credential issued
# for THIS notebook rather than the shared service key. The Supabase push is
# unchanged, runs first, and stays authoritative; nothing in this transport can
# make a sync fail.
#
#   ingest_mode: off     nothing is built and nothing is sent (default)
#                shadow  delivered; every failure is noise and is not reported
#                dual    delivered; a failure marks the run 'partial' so it shows
#                        on the Health page
#
# Roll out one notebook at a time: set ingest_mode to 'shadow' remotely from the
# Health page, read the run's log, then move it to 'dual'.
#
# ingest_url and ingest_mode are remote-config keys. `ingest_url` must also be
# bootstrapped locally when the authenticated config API is first enabled; after
# that, the dashboard may rotate it remotely. ingest_token is NOT, and
# never will be: it is a credential, and a remote blob that could set it would
# be a way to hand every notebook a token of somebody else's choosing. Mint one
# per notebook through the dashboard's
# admin.agentCredentialIssue operation; the plaintext is shown exactly once.
#
# ingest_url: "https://<your-app>.vercel.app/api/import?op=agent.ingest"
# ingest_mode: "off"
# ingest_token: "lha.<credential-uuid>.<secret>"

# Signed release verification. This is a local-only Ed25519 public key in
# unpadded base64url form (32 bytes). It is a trust anchor, so it cannot be
# changed through instances.config. A missing or invalid key disables only
# self-update; it never prevents the scheduled sync from running.
# release_public_key: "<base64url-ed25519-public-key>"

# LH2 campaign ids this notebook must NEVER sync (test campaigns, etc.).
# Archiving in LH2 is not enough — archived campaigns stay in lh.db and would
# be re-created in Supabase on the next sync. Also settable remotely from the
# Health page. Applies to campaigns, leads, events, steps and messages.
# exclude_campaigns: [4]

# Unique per notebook. Use the same value forever so upserts stay idempotent.
instance_id: "notebook-1"
instance_label: "Notebook 1 — Alice"

# Real LinkedIn identity of the account this instance runs as — shown on the
# dashboard (name, profile link, photo) instead of the bare instance label.
# Leave empty to pull from lh.db via the optional mapping.owner query below.
# NOTE: LinkedIn image URLs (media.licdn.com/...) are signed and EXPIRE after
# a few weeks — only paste a stable URL here; expiring avatars belong in the
# owner query, which refreshes them on every sync.
account_name: ""        # e.g. "Alice Petrova"
account_url: ""         # e.g. "https://www.linkedin.com/in/alice-petrova/"
account_avatar: ""      # stable image URL, or leave empty

# Path to the Linked Helper 2 SQLite database (linked-helper-account-<ID>-main/lh.db).
# Leave empty to auto-discover: the agent scans the default LH2 data dirs and
# picks the most recently active account DB (it prints which one it chose).
# NOTE: current LH2 builds store data in a `linked-helper` folder (older builds
# used `Linked Helper 2`); auto-discovery now checks both, on macOS/Windows/Linux.
# Set explicitly only if auto-discovery picks the wrong account —
# `python3 agent.py inspect` lists all candidates with row counts.
lh2_db_path: ""

# Map LH2's tables/columns (printed by `inspect`) to the normalized schema.
# Each section takes either a simple `table:` or a raw `query:` — LH2 spreads
# lead data across several tables (person_in_campaigns_history,
# person_external_ids, person_original_mini_profile, ...), so leads usually
# need a JOIN. Column keys refer to the query's result aliases. Timestamps
# may be epoch milliseconds; the agent normalizes them automatically.
# If your LH2 version has no readable SQLite, use `ingest-csv` instead.
mapping:
  campaigns:
    table: "campaigns"
    id: "id"
    name: "name"
    status: "state"
  leads:
    # Adapt the JOIN to your schema as printed by `inspect`. Example shape
    # below. KNOWN PITFALLS (verified against a real LH2 lh.db):
    #  - invited_at must come from InvitePerson action results (result=1),
    #    NOT add_to_target_date (that's just "queued into campaign" — which is
    #    exactly what added_at wants, so map it there instead)
    #  - replied_at lives in action_result_messages (type='Replied', written
    #    by CheckForReplies actions), not on the campaign-history row
    #  - person_external_ids has ~2 'public' rows per person (human slug +
    #    opaque 'AC...' id) — joining it raw duplicates every lead with an
    #    arbitrary slug pick. Dedupe to one slug per person as shown below.
    # Prefer copying a proven config.yaml from an already-synced notebook.
    # Verify with `agent.py sync --dry-run` before the first real sync.
    query: |
      select
        pic.campaign_id            as campaign_id,
        'https://www.linkedin.com/in/' || pei.external_id as profile_url,
        pmp.full_name              as full_name,
        pmp.headline               as headline,
        pic.add_to_target_date     as added_at,
        pic.invited_at             as invited_at,
        pic.connected_at           as connected_at,
        pic.replied_at             as replied_at,
        pic.updated_at             as last_action_at
      from person_in_campaigns_history pic
      join (
        select person_id, external_id from (
          select person_id, external_id,
                 row_number() over (partition by person_id
                   order by (external_id like 'AC%'), rowid desc) as rn
          from person_external_ids where type_group = 'public'
        ) where rn = 1
      ) pei on pei.person_id = pic.person_id
      left join person_original_mini_profile pmp
        on pmp.person_id = pic.person_id
    campaign_id: "campaign_id"
    profile_url: "profile_url"
    full_name: "full_name"
    headline: "headline"
    added_at: "added_at"
    invited_at: "invited_at"
    connected_at: "connected_at"
    replied_at: "replied_at"
    last_action_at: "last_action_at"

  # Conversation history is BUILT IN (see sync_messages above) — the agent reads
  # the full thread from action_result_messages with no mapping. Uncomment and
  # adapt this ONLY if your LH2 version stores messages differently than the
  # built-in query expects (check with `agent.py inspect`). When set, it fully
  # overrides the built-in. Emit a `direction` column ('in' for replies, 'out'
  # for sends); dedupe person_external_ids to one slug per person as in `leads`.
  # messages:
  #   query: |
  #     select pic.campaign_id as campaign_id,
  #            'https://www.linkedin.com/in/' || pei.external_id as profile_url,
  #            arm.text as body, arm.created_at as sent_at,
  #            case when arm.type = 'Replied' then 'in' else 'out' end as direction
  #     from action_result_messages arm
  #     join (<one-slug-per-person dedup, see leads mapping>) pei
  #       on pei.person_id = arm.person_id
  #     left join person_in_campaigns_history pic on pic.person_id = arm.person_id
  #     where arm.type in ('Sent', 'Message', 'Replied')
  #   campaign_id: "campaign_id"
  #   profile_url: "profile_url"
  #   body: "body"
  #   sent_at: "sent_at"
  #   direction: "direction"

  # Age-inference signals are BUILT IN: the agent extracts each lead's earliest
  # education start year and earliest first-job start year straight from lh.db
  # (person_education / person_positions, deduped to one slug per person like
  # `leads`; implausible placeholder years — LH2 stores 1900/1970, and future-dated
  # typos — are rejected before the MIN). No mapping needed for a standard LH2
  # schema, and a build WITHOUT these tables just syncs with no years (fails safe to
  # empty, sync still completes). Uncomment and adapt ONLY for a non-standard layout:
  # each query must produce a `profile_url` (same slug format as leads) and a
  # `start_year` column (add explicit alias keys if you name them differently). The
  # agent takes the MIN plausible year per profile and NEVER overwrites a stored
  # year with NULL, so these are safe to leave enabled across re-syncs.
  # education_year:
  #   query: |
  #     select 'https://www.linkedin.com/in/' || pei.external_id as profile_url,
  #            pe.start_year as start_year
  #     from person_education pe
  #     join (<one-slug-per-person dedup, see leads mapping>) pei
  #       on pei.person_id = pe.person_id
  #     where pe.start_year between 1950 and 2100
  # first_job_year:
  #   query: |
  #     select 'https://www.linkedin.com/in/' || pei.external_id as profile_url,
  #            pp.start_year as start_year
  #     from person_positions pp
  #     join (<one-slug-per-person dedup, see leads mapping>) pei
  #       on pei.person_id = pp.person_id
  #     where pp.start_year between 1950 and 2100

  # Optional: the logged-in account's own profile, straight from lh.db, so
  # name/photo refresh on every sync. Locate where your LH2 version stores it
  # with `agent.py inspect` — look for owner/"me"/settings-like tables or a
  # key-value store; the result must expose the aliases referenced below.
  # Values set manually above take precedence over this query.
  # owner:
  #   query: |
  #     select full_name as name,
  #            'https://www.linkedin.com/in/' || public_id as profile_url,
  #            avatar_url as avatar_url
  #     from me limit 1
  #   name: "name"
  #   profile_url: "profile_url"
  #   avatar_url: "avatar_url"
